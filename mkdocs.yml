site_name: WJP Wiki
site_description: >-
  Shared workflows, tools, and best practices for working with code and data at WJP.
# site_url is intentionally left unset. When it includes a subpath (.../wiki/),
# `mkdocs serve` nests the local site under that path and the dev server bounces
# `localhost:8000` to `/wiki/`, which breaks local navigation. The site still
# deploys correctly to GitHub Pages because all internal links are relative.
# site_url: https://worldjusticeproject-org.github.io/wiki/

repo_name: worldjusticeproject-org/wiki
repo_url: https://github.com/worldjusticeproject-org/wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/wjp-logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      # WJP brand colors are defined in docs/stylesheets/extra.css
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      # WJP brand colors are defined in docs/stylesheets/extra.css
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{date}/{slug}"
      authors: true
      categories: true
      pagination: true
      pagination_per_page: 10
      archive: true
      archive_date_format: yyyy

extra_css:
  - stylesheets/extra.css

nav:
  - Home:
      - index.md
      - Contributing to the Wiki: home/contributing.md
  - Guide:
      - guide/index.md
      - Getting Started:
          - Basic Concepts: guide/getting-started/basic-concepts.md
          - Environment Setup: guide/getting-started/environment-setup.md
      - Using GitHub:
          - Core Workflow: guide/github/core-workflow.md
          - Pull Requests & Review: guide/github/pull-requests.md
          - Issues & Discussions: guide/github/issues-discussions.md
      - Languages:
          - guide/languages/index.md
          - Python: guide/languages/python.md
          - R: guide/languages/r.md
          - Stata: guide/languages/stata.md
      - WJP Standards:
          - GitHub Rules: guide/wjp-standards/github-rules.md
          - Naming Conventions: guide/wjp-standards/naming-conventions.md
          - Data & Security: guide/wjp-standards/data-and-security.md
          - SharePoint Integration: guide/wjp-standards/sharepoint.md
          - Project Workflows: guide/wjp-standards/project-workflows.md
          - Documentation & Handoff: guide/wjp-standards/documentation-handoff.md
  - Blog:
      - blog/index.md
  - Resources:
      - resources/index.md
